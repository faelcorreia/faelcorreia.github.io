<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0a20">
    <meta name="description" content="Another Runner — um endless runner de plataforma em pixel art. Pule, colete e sobreviva.">
    <title>Another Runner</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main id="game-shell" aria-label="Another Runner, jogo de corrida em pixel art">
        <div id="game"></div>

        <div id="loading" aria-live="polite">
            <div class="loading-pixels" aria-hidden="true">
                <span></span><span></span><span></span>
            </div>
            <p>carregando</p>
        </div>

        <div id="fatal" hidden>
            <p>Não foi possível carregar o jogo.</p>
            <p class="fatal-hint">Confira a conexão e recarregue a página.</p>
        </div>

        <div id="rotate-hint" role="dialog" aria-label="Sugestão de orientação da tela">
            <div class="phone-icon" aria-hidden="true"></div>
            <p>Gire o celular para jogar melhor</p>
            <button id="continue-anyway" type="button">jogar assim mesmo</button>
        </div>
    </main>

    <noscript>
        <div class="noscript">
            <p>Another Runner precisa de JavaScript para rodar.</p>
        </div>
    </noscript>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="js/art.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
